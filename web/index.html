<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New in SF — openings</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#141b24; --panel2:#1b2530; --line:#26313c;
    --ink:#e9edf1; --soft:#9aa6b2; --fog:#6b7783;
    --soon:#f0b45e; --open:#3ddc84;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #app{display:grid;grid-template-columns:390px 1fr;height:100vh}
  @media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:52vh 1fr}}

  /* panel */
  #panel{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--bg)}
  header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:1.35rem;letter-spacing:-.02em;font-weight:800}
  h1 .g{color:var(--open);text-shadow:0 0 18px rgba(61,220,132,.45)}
  .sub{margin:4px 0 0;color:var(--soft);font-size:.82rem}
  .stats{display:flex;gap:16px;margin-top:12px}
  .stat .n{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .l{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fog)}
  .stat .n.open{color:var(--open)} .stat .n.soon{color:var(--soon)}

  .filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--soft);border-radius:999px;
    padding:6px 12px;font-size:.78rem;cursor:pointer;font-weight:600}
  .chip.active{color:var(--ink);border-color:var(--soft)}
  .chip.active[data-s="open"]{color:var(--open);border-color:var(--open);background:rgba(61,220,132,.1)}
  .chip.active[data-s="coming_soon"]{color:var(--soon);border-color:var(--soon);background:rgba(240,180,94,.1)}

  #list{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
  .card:hover,.card.sel{border-color:var(--soft)}
  .card.sel{background:var(--panel2)}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card .name{font-weight:700;font-size:1rem;letter-spacing:-.01em}
  .card .hood{color:var(--fog);font-size:.76rem;margin-top:2px}
  .badge{flex:none;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;border-radius:999px;white-space:nowrap}
  .badge.open{color:var(--open);background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.35)}
  .badge.coming_soon{color:var(--soon);background:rgba(240,180,94,.12);border:1px solid rgba(240,180,94,.3)}
  .card .hook{margin:9px 0 0;font-size:.86rem;color:var(--ink);line-height:1.4}
  .card .desc{margin:6px 0 0;font-size:.8rem;color:var(--soft);line-height:1.45}
  .card .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:.66rem;color:var(--soft);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
  .card .meta{margin-top:9px;font-size:.68rem;color:var(--fog);display:flex;gap:10px;flex-wrap:wrap}
  .card .conf{font-variant-numeric:tabular-nums}
  #map{height:100%}
  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;font-family:var(--sans);padding:12px 14px;max-width:240px}
  .maplibregl-popup-content .pn{font-weight:700}
  .maplibregl-popup-content .ph{color:var(--fog);font-size:.75rem;margin-top:2px}
  .maplibregl-popup-content .pd{font-size:.8rem;color:var(--soft);margin-top:6px;line-height:1.4}
  .maplibregl-popup-tip{border-top-color:var(--line)!important}
  .empty{color:var(--fog);text-align:center;padding:30px;font-size:.85rem}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <header>
      <h1>New in <span class="g">SF</span></h1>
      <p class="sub">Cafes &amp; retail opening across the city — from permit filings, confirmed live.</p>
      <div class="stats">
        <div class="stat"><div class="n" id="s-total">–</div><div class="l">tracked</div></div>
        <div class="stat"><div class="n open" id="s-open">–</div><div class="l">open</div></div>
        <div class="stat"><div class="n soon" id="s-soon">–</div><div class="l">coming soon</div></div>
      </div>
    </header>
    <div class="filters">
      <div class="chip active" data-s="all">All</div>
      <div class="chip" data-s="open">Open</div>
      <div class="chip" data-s="coming_soon">Coming soon</div>
      <div class="chip" data-s="enriched">Has story</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>
<script>
const COLORS={open:'#3ddc84',just_opened:'#3ddc84',coming_soon:'#f0b45e'};
let PLACES=[], filter='all', selected=null, map, popup;

function statusClass(s){return s==='coming_soon'?'coming_soon':'open';}
function statusLabel(s){return s==='coming_soon'?'Coming soon':(s==='just_opened'?'Just opened':'Open');}
function hasStory(p){const e=p.enrichment||{};return e.model&&e.model!=='stub-no-key'&&(e.description||e.hook);}

function visible(){
  return PLACES.filter(p=>{
    if(p.status==='cancelled')return false;
    if(filter==='open')return p.status==='open'||p.status==='just_opened';
    if(filter==='coming_soon')return p.status==='coming_soon';
    if(filter==='enriched')return hasStory(p);
    return true;
  });
}

function renderList(){
  const el=document.getElementById('list');
  const rows=visible().slice().sort((a,b)=>{
    // enriched first, then open, then by permit date desc
    const sa=(hasStory(a)?2:0)+((a.status!=='coming_soon')?1:0);
    const sb=(hasStory(b)?2:0)+((b.status!=='coming_soon')?1:0);
    if(sa!==sb)return sb-sa;
    return (b.permit_start||'').localeCompare(a.permit_start||'');
  });
  if(!rows.length){el.innerHTML='<div class="empty">No places match.</div>';return;}
  el.innerHTML='';
  for(const p of rows){
    const e=p.enrichment||{};
    const c=document.createElement('div');
    c.className='card'+(selected===p.uniqueid?' sel':'');
    c.dataset.id=p.uniqueid;
    let html='<div class="top"><div><div class="name">'+esc(p.dba_name)+'</div>'+
      '<div class="hood">'+esc(p.neighborhood||'San Francisco')+' · '+esc(p.address)+'</div></div>'+
      '<span class="badge '+statusClass(p.status)+'">'+statusLabel(p.status)+'</span></div>';
    if(e.hook)html+='<div class="hook">'+esc(e.hook)+'</div>';
    if(e.description)html+='<div class="desc">'+esc(e.description)+'</div>';
    if(e.tags&&e.tags.length)html+='<div class="tags">'+e.tags.slice(0,5).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
    const meta=[];
    if(hasStory(p))meta.push('confidence '+Math.round((e.confidence||0)*100)+'%');
    if(e.opening_date)meta.push('opened '+esc(e.opening_date));
    if(e.sources&&e.sources.length)meta.push(e.sources.length+' sources');
    if(meta.length)html+='<div class="meta">'+meta.map(m=>'<span>'+m+'</span>').join('')+'</div>';
    c.innerHTML=html;
    c.onclick=()=>select(p.uniqueid,true);
    el.appendChild(c);
  }
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function select(id,fly){
  selected=id;renderList();
  const p=PLACES.find(x=>x.uniqueid===id);if(!p||p.lat==null)return;
  const card=document.querySelector('.card.sel');if(card)card.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(fly)map.flyTo({center:[p.lng,p.lat],zoom:15,speed:.8});
  const e=p.enrichment||{};
  if(popup)popup.remove();
  popup=new maplibregl.Popup({offset:14,closeButton:false})
    .setLngLat([p.lng,p.lat])
    .setHTML('<div class="pn">'+esc(p.dba_name)+'</div><div class="ph">'+esc(p.neighborhood||'')+' · '+statusLabel(p.status)+'</div>'+
      (e.description?'<div class="pd">'+esc(e.description)+'</div>':''))
    .addTo(map);
}

function buildGeo(){
  return {type:'FeatureCollection',features:visible().filter(p=>p.lat!=null).map(p=>({
    type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat]},
    properties:{id:p.uniqueid,status:p.status,story:hasStory(p)?1:0}
  }))};
}
function refreshMap(){if(map.getSource('pts'))map.getSource('pts').setData(buildGeo());}

function initMap(){
  map=new maplibregl.Map({
    container:'map',
    style:{version:8,sources:{c:{type:'raster',tiles:['https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap © CARTO'}},layers:[{id:'c',type:'raster',source:'c'}]},
    center:[-122.437,37.767],zoom:12
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.on('load',()=>{
    map.addSource('pts',{type:'geojson',data:buildGeo()});
    map.addLayer({id:'halo',type:'circle',source:'pts',filter:['==',['get','story'],1],
      paint:{'circle-radius':11,'circle-color':['match',['get','status'],'coming_soon',COLORS.coming_soon,COLORS.open],'circle-opacity':.18}});
    map.addLayer({id:'dots',type:'circle',source:'pts',
      paint:{'circle-radius':['case',['==',['get','story'],1],6,4],
        'circle-color':['match',['get','status'],'coming_soon',COLORS.coming_soon,COLORS.open],
        'circle-stroke-width':1.2,'circle-stroke-color':'#0d1117'}});
    map.on('click','dots',e=>select(e.features[0].properties.id,true));
    map.on('mouseenter','dots',()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave','dots',()=>map.getCanvas().style.cursor='');
  });
}

document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  ch.classList.add('active');filter=ch.dataset.s;renderList();refreshMap();
});

fetch('/data/openings.json').then(r=>r.json()).then(d=>{
  PLACES=d.places||[];
  const live=PLACES.filter(p=>p.status!=='cancelled');
  document.getElementById('s-total').textContent=live.length;
  document.getElementById('s-open').textContent=live.filter(p=>p.status==='open'||p.status==='just_opened').length;
  document.getElementById('s-soon').textContent=live.filter(p=>p.status==='coming_soon').length;
  renderList();initMap();
}).catch(e=>{document.getElementById('list').innerHTML='<div class="empty">Could not load openings.json — is the server serving the project root?</div>';});
</script>
</body>
</html>
